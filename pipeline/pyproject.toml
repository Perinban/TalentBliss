[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "2.1.0"
description = "JOIN job ingestion pipeline for TalentBliss"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
