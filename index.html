<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="3; url=https://negotiation-participation-phenomenon-ftp.trycloudflare.com/" />
    <link rel="canonical" href="https://negotiation-participation-phenomenon-ftp.trycloudflare.com/" />
    <title>Opening TalentBliss</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f6fb;
        color: #121a2e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid #dce4f0;
        border-radius: 32px;
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(35, 55, 90, 0.12);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        background: #e8f8ef;
        color: #16733d;
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #25a861;
      }

      h1 {
        margin: 30px 0 16px;
        font-size: clamp(44px, 10vw, 76px);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: #586783;
        font-size: clamp(18px, 3vw, 23px);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 34px;
        padding: 16px 22px;
        border-radius: 14px;
        background: #121a2e;
        color: #ffffff;
        font-size: 18px;
        font-weight: 750;
        text-decoration: none;
      }
    </style>
    <script>
      const destination = "https://negotiation-participation-phenomenon-ftp.trycloudflare.com";
      const prefix = "/TalentBliss";
      const route = window.location.pathname.startsWith(prefix)
        ? window.location.pathname.slice(prefix.length) || "/"
        : "/";
      window.location.replace(destination + route + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <main>
      <div class="badge"><span class="dot"></span>TalentBliss is online</div>
      <h1>TalentBliss</h1>
      <p>You are being redirected to the live TalentBliss application running on Oracle staging.</p>
      <a href="https://negotiation-participation-phenomenon-ftp.trycloudflare.com/">Open TalentBliss</a>
    </main>
  </body>
</html>
